name: ConformIA CI/CD & AWS Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------
  # Job 1: Verificação de Tipagem, Testes e Build
  # -------------------------------------------------------------
  validate-and-test:
    name: Typecheck, Testes & Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (OSS)
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Escanear Segredos no Repositório (Gitleaks OSS)
        run: gitleaks detect --source . --verbose --redact

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências do Monorepo e Workspaces
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Verificação Estrita de Tipos TypeScript (Typecheck)
        run: npm run typecheck
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://localhost:27017/conformia_test
          JWT_SECRET: conformia-super-secret-jwt-key-for-ci-tests-2026

      - name: Execução dos Testes Automatizados (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://localhost:27017/conformia_test
          JWT_SECRET: conformia-super-secret-jwt-key-for-ci-tests-2026

      - name: Compilação dos Bundles de Produção (Build)
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Build & Push de Imagens Docker (GHCR)
  # -------------------------------------------------------------
  build-docker-images:
    name: Build & Push Containers Docker (GHCR)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Normalizar nome do repositório para minúsculas
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Imagem Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/dashboard-api:latest
            ghcr.io/${{ env.REPO_LC }}/dashboard-api:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}/dashboard-api:1.0.0

      - name: Build & Push Imagem Frontend Web
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-web
          file: ./dashboard-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/dashboard-web:latest
            ghcr.io/${{ env.REPO_LC }}/dashboard-web:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}/dashboard-web:1.0.0

  # -------------------------------------------------------------
  # Job 3: Deploy Automatizado Seguro na AWS EC2
  # -------------------------------------------------------------
  deploy-aws-ec2:
    name: Deploy Seguro na AWS EC2
    needs: build-docker-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Sincronizar docker-compose.yml na EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/conformia/"
          overwrite: true

      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: latest
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }} 
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_VERSION
          script: |
            cd /opt/conformia
            echo "🔑 Autenticando no GitHub Container Registry (GHCR)..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "📥 Atualizando imagens no servidor de produção..."
            APP_VERSION=latest docker compose pull || true
            echo "🔄 Reiniciando containers da ConformIA..."
            APP_VERSION=latest docker compose up -d --remove-orphans
            echo "⏳ Aguardando inicialização e estabilização dos serviços..."
            sleep 15
            echo "🩺 Verificando integridade dos serviços..."
            curl --fail http://localhost:3333/health || curl --fail http://localhost:3000/health || curl --fail http://localhost/health || exit 1
            echo "✅ Deploy concluído com sucesso!"