  # -------------------------------------------------------------
  # Job 4: Promoção da Mesma Imagem Imutável para Produção (AWS EC2)
  # -------------------------------------------------------------
  deploy-production:
    name: Promoção Imutável para Produção (AWS EC2)
    needs: [build-docker-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Sincronizar arquivos de Produção na EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "docker-compose.yml,scripts/ec2-disk-cleanup.sh,scripts/ec2-deploy-release.sh"
          target: "/opt/conformia/"
          overwrite: true

      - name: Executar Deploy Imutável em Produção com Auto-Rollback
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build-docker-images.outputs.image_tag }}
          DEPLOY_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_VERSION,DEPLOY_ACTOR
          script: |
            set -euo pipefail
            mkdir -p /opt/conformia/scripts
            mv -f /opt/conformia/ec2-disk-cleanup.sh /opt/conformia/scripts/ec2-disk-cleanup.sh 2>/dev/null || true
            mv -f /opt/conformia/ec2-deploy-release.sh /opt/conformia/scripts/ec2-deploy-release.sh 2>/dev/null || true
            chmod +x /opt/conformia/scripts/ec2-disk-cleanup.sh /opt/conformia/scripts/ec2-deploy-release.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            DEPLOY_ENV=production \
            DEPLOY_DIR=/opt/conformia \
            COMPOSE_PROJECT_NAME=conformia \
            COMPOSE_FILES="-f docker-compose.yml" \
            API_HEALTH_URL="http://127.0.0.1:3333/health" \
            WORKER_HEALTH_URL="http://127.0.0.1:3001/health" \
            ACTION=DEPLOY \
            DEPLOY_REASON="CI Production Promotion (${APP_VERSION})" \
            /opt/conformia/scripts/ec2-deploy-release.sh
