name: ConformIA CI/CD & Immutable Release Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # -------------------------------------------------------------
  # Job 1: Verificação de Tipagem, Testes, Segurança e Build
  # -------------------------------------------------------------
  validate-and-test:
    name: Typecheck, Testes & Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (OSS)
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Escanear Segredos no Repositório (Gitleaks OSS)
        run: gitleaks detect --source . --verbose --redact

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências do Monorepo e Workspaces
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Verificação Estrita de Tipos TypeScript (Typecheck)
        run: npm run typecheck
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://localhost:27017/conformia_test
          JWT_SECRET: conformia-super-secret-jwt-key-for-ci-tests-2026

      - name: Execução dos Testes Automatizados (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://localhost:27017/conformia_test
          JWT_SECRET: conformia-super-secret-jwt-key-for-ci-tests-2026

      - name: Compilação dos Bundles de Produção (Build)
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Build & Push de Imagens Docker Imutáveis (GHCR)
  # -------------------------------------------------------------
  build-docker-images:
    name: Build & Push Imagens Imutáveis (GHCR)
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Definir Tag Imutável da Release
        id: meta
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "REPO_LC=${REPO_LC}" >> "$GITHUB_ENV"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag calculada: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Imagem Backend API (Tag Imutável)
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/dashboard-api:${{ steps.meta.outputs.image_tag }}

      - name: Build & Push Imagem Frontend Web (Tag Imutável)
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-web
          file: ./dashboard-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/dashboard-web:${{ steps.meta.outputs.image_tag }}

