name: ConformIA CI/CD & AWS Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------
  # Job 1: Verificação de Tipagem, Testes e Build
  # -------------------------------------------------------------
  validate-and-test:
    name: Typecheck, Testes & Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Instalar Dependências dos Workspaces
        run: |
          npm --prefix dashboard ci
          npm --prefix dashboard-web ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Verificação Estrita de Tipos TypeScript (Typecheck)
        run: npm run typecheck

      - name: Execução dos Testes Automatizados (Vitest)
        run: npm test

      - name: Compilação dos Bundles de Produção (Build)
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Build & Push de Imagens Docker (GHCR)
  # -------------------------------------------------------------
  build-docker-images:
    name: Build & Push Containers Docker (GHCR)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Imagem Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/dashboard-api:latest
            ghcr.io/${{ github.repository }}/dashboard-api:${{ github.sha }}

      - name: Build & Push Imagem Frontend Web
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-web
          file: ./dashboard-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/dashboard-web:latest
            ghcr.io/${{ github.repository }}/dashboard-web:${{ github.sha }}

  # -------------------------------------------------------------
  # Job 3: Deploy Automatizado Seguro na AWS EC2
  # -------------------------------------------------------------
  deploy-aws-ec2:
    name: Deploy Seguro na AWS EC2
    needs: build-docker-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd /opt/conformia
            echo "📥 Atualizando imagens no servidor de produção..."
            docker compose pull
            echo "🔄 Reiniciando containers da ConformIA..."
            docker compose up -d --remove-orphans
            echo "🩺 Verificando integridade dos serviços..."
            curl --fail http://localhost/health || exit 1
            echo "✅ Deploy concluído com sucesso!"

