x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # -------------------------------------------------------------
  # Redis: Fila BullMQ e Cache Operacional com Autenticação e Proteção
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: conformia-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}
    ports:
      # Vinculação estrita ao loopback local (127.0.0.1) impedindo exposição pública
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - conformia-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          memory: 128M

  # -------------------------------------------------------------
  # Backend REST API (Node.js 20 + Express + Prisma)
  # -------------------------------------------------------------
  dashboard-api:
    image: ghcr.io/conform-ai-health/conform-ai-health/dashboard-api:${APP_VERSION:-dev}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: conformia-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    ports:
      # Restrict plain HTTP to the host; expose it publicly only through a TLS-terminating reverse proxy.
      - "127.0.0.1:${API_PORT:-3333}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=/api/v1
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_ENV=${APP_ENV:-production}
      - SERVICE_NAME=conformia-api
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-nao-responder@conformia.med.br}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - EXTRACTION_MODE=${EXTRACTION_MODE:-CHEERIO}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@conform.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD é obrigatória}
      - MONITORING_API_KEY=${MONITORING_API_KEY:?MONITORING_API_KEY é obrigatória}
      - CRAWL_MAX_PAGES=${CRAWL_MAX_PAGES:-1000}
      - CRAWL_MAX_LINKS_PER_PAGE=${CRAWL_MAX_LINKS_PER_PAGE:-50}
      - CRAWL_BATCH_SIZE=${CRAWL_BATCH_SIZE:-4}
      - RAG_MAX_CANDIDATE_CHUNKS=${RAG_MAX_CANDIDATE_CHUNKS:-10000}
      - RAG_VECTOR_SEARCH_ENABLED=${RAG_VECTOR_SEARCH_ENABLED:-true}
      - RAG_VECTOR_INDEX_NAME=${RAG_VECTOR_INDEX_NAME:-vector_index_norms_chunk}
      - SSRF_ALLOWED_HOSTS=${SSRF_ALLOWED_HOSTS:-}
      - AI_INVOCATION_CACHE_ENABLED=${AI_INVOCATION_CACHE_ENABLED:-true}
      - AI_INVOCATION_CACHE_TTL_SECONDS=${AI_INVOCATION_CACHE_TTL_SECONDS:-86400}
      - DISTRIBUTED_RESILIENCE=${DISTRIBUTED_RESILIENCE:-true}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-${OLLAMA_HOST:-http://localhost:11434}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - conformia-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          memory: 256M

  # -------------------------------------------------------------
  # Worker Assíncrono de Auditoria Deontológica (BullMQ)
  # -------------------------------------------------------------
  audit-worker:
    image: ghcr.io/conform-ai-health/conform-ai-health/dashboard-api:${APP_VERSION:-dev}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: conformia-worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    command: ["node", "dist/worker.js"]
    ports:
      # Exposição da porta de saúde e telemetria Prometheus do Worker no loopback
      - "127.0.0.1:${WORKER_HEALTH_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WORKER_HEALTH_PORT=3001
      - API_PREFIX=/api/v1
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_ENV=${APP_ENV:-production}
      - SERVICE_NAME=conformia-worker
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-nao-responder@conformia.med.br}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - EXTRACTION_MODE=${EXTRACTION_MODE:-CHEERIO}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@conform.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD é obrigatória}
      - MONITORING_API_KEY=${MONITORING_API_KEY:?MONITORING_API_KEY é obrigatória}
      - CRAWL_MAX_PAGES=${CRAWL_MAX_PAGES:-1000}
      - CRAWL_MAX_LINKS_PER_PAGE=${CRAWL_MAX_LINKS_PER_PAGE:-50}
      - CRAWL_BATCH_SIZE=${CRAWL_BATCH_SIZE:-4}
      - RAG_MAX_CANDIDATE_CHUNKS=${RAG_MAX_CANDIDATE_CHUNKS:-10000}
      - RAG_VECTOR_SEARCH_ENABLED=${RAG_VECTOR_SEARCH_ENABLED:-true}
      - RAG_VECTOR_INDEX_NAME=${RAG_VECTOR_INDEX_NAME:-vector_index_norms_chunk}
      - SSRF_ALLOWED_HOSTS=${SSRF_ALLOWED_HOSTS:-}
      - AI_INVOCATION_CACHE_ENABLED=${AI_INVOCATION_CACHE_ENABLED:-true}
      - AI_INVOCATION_CACHE_TTL_SECONDS=${AI_INVOCATION_CACHE_TTL_SECONDS:-86400}
      - DISTRIBUTED_RESILIENCE=${DISTRIBUTED_RESILIENCE:-true}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-${OLLAMA_HOST:-http://localhost:11434}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - conformia-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          memory: 256M

  # -------------------------------------------------------------
  # Frontend SPA (Vite + React + Nginx Proxy)
  # -------------------------------------------------------------
  dashboard-web:
    image: ghcr.io/conform-ai-health/conform-ai-health/dashboard-web:${APP_VERSION:-dev}
    build:
      context: ./dashboard-web
      dockerfile: Dockerfile
    container_name: conformia-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "0.0.0.0:${WEB_PORT:-3000}:80"
    depends_on:
      dashboard-api:
        condition: service_healthy
    networks:
      - conformia-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M

networks:
  conformia-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
